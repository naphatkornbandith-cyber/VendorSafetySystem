<script>
// ========================================================
// 1. Multi-language (i18n) Engine
// ========================================================
const i18n = {
  th: {
    menu_dashboard: "แดชบอร์ด",
    menu_vendors: "ทะเบียนผู้รับเหมา",

    status_fail: "ไม่ผ่าน",
    kpi_companies: "บริษัทที่ได้รับการตรวจ",
    kpi_total: "จำนวนการตรวจทั้งหมด",
    kpi_morning: "ตรวจช่วงเช้า",
    kpi_afternoon: "ตรวจช่วงบ่าย",
    select_company: "เลือกบริษัท",
    select_period: "เลือกช่วงเวลา",
    select_result: "เลือกผลการตรวจ",
    evidence_section: "หลักฐานภาพถ่ายและเอกสาร",
    no_data: "ไม่พบข้อมูลในระบบ"
  },
  en: {

    menu_vendors: "Vendor Registration",
    menu_inspection: "Safety Inspection",
    menu_history: "Inspection History",
    menu_permits: "Work Permit",
    menu_documents: "Document Management",
    menu_archives: "Department Archives",
    system_ready: "System Ready (v2.0)",

    save: "Save",
    saving: "Saving...",
    cancel: "Cancel",
    close: "Close",
    search_placeholder: "Search (Company name, location, etc.)...",
    filter_all: "All",
    status_active: "Active",
    status_inactive: "Inactive",
    status_pass: "Pass",
    status_improve: "Needs Improvement",
    status_fail: "Fail",
    kpi_companies: "Companies Inspected",
    kpi_total: "Total Inspections",
    kpi_morning: "Morning Period",
    kpi_afternoon: "Afternoon Period",
    select_company: "Select Company",
    select_period: "Select Period",
    select_result: "Select Result",
    evidence_section: "Inspection Evidence & Files",
    no_data: "No records found"
  }
};

let currentLang = localStorage.getItem("vendor_safety_lang") || "th";

function t(key) {
  return (i18n[currentLang] && i18n[currentLang][key]) || (i18n.en && i18n.en[key]) || key;
}

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("vendor_safety_lang", lang);

  document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
  const activeBtn = document.getElementById("lang-" + lang);
  if (activeBtn) activeBtn.classList.add("active");

  // Update static UI elements
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });

  // Re-render current page
  if (window.currentPageName) {
    showPage(window.currentPageName, null, true);
  }
}

// Mobile Sidebar
function toggleMobileSidebar(open) {
  const sidebar = document.getElementById("app-sidebar");
  const backdrop = document.getElementById("sidebar-backdrop");
  if (open) {
    sidebar.classList.add("open");
    backdrop.classList.add("active");
  } else {
    sidebar.classList.remove("open");
    backdrop.classList.remove("active");
  }
}

// ========================================================
// 2. SPA Router
// ========================================================
function showPage(page, button, isLangChange) {
  window.currentPageName = page;
  toggleMobileSidebar(false);

  const titles = {
    dashboard: t("menu_dashboard"),
    vendors: t("menu_vendors"),
    inspection: t("menu_inspection"),
    history: t("menu_history"),
    permits: t("menu_permits"),
    documents: t("menu_documents"),
    archives: t("menu_archives")
  };

  document.getElementById("page-title").textContent = titles[page] || "Dashboard";

  if (!isLangChange) {
    document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
    const navBtn = button || document.getElementById("nav-" + page);
    if (navBtn) navBtn.classList.add("active");
  }

  if (page === "dashboard") renderDashboard();
  else if (page === "vendors") renderVendorPage();
  else if (page === "inspection") renderInspectionPage();
  else if (page === "history") renderHistoryPage();
  else if (page === "permits") renderPermitsPage();
  else if (page === "documents") renderDocumentsPage();
  else if (page === "archives") renderArchivesPage();
}

// ========================================================
// 3. Module: Dashboard
// ========================================================
function renderDashboard() {
  const content = document.getElementById("page-content");
  const now = new Date();
  const todayStr = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");

  content.innerHTML = `
    <div class="welcome">
      <div>
        <h1>${t("menu_dashboard")}</h1>
        <p>${t("subtitle_main")}</p>
      </div>
      <div class="date-box">
        <label>${currentLang === 'th' ? 'เลือกวันที่ตรวจ' : 'Inspection Date'}</label>
        <input type="date" id="dashboard-date" value="${todayStr}">
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <span>${t("kpi_companies")}</span>
        <h2 id="kpi-companies">-</h2>
        <small>${currentLang === 'th' ? 'บริษัทที่ผ่านการตรวจวันนี้' : 'Companies today'}</small>
      </div>
      <div class="kpi-card">
        <span>${t("kpi_total")}</span>
        <h2 id="kpi-total">-</h2>
        <small>${currentLang === 'th' ? 'บันทึกการตรวจทั้งหมด' : 'Total records'}</small>
      </div>
      <div class="kpi-card">
        <span>${t("kpi_morning")}</span>
        <h2 id="kpi-morning">-</h2>
        <small>${currentLang === 'th' ? 'รอบช่วงเช้า' : 'Morning records'}</small>
      </div>
      <div class="kpi-card">
        <span>${t("kpi_afternoon")}</span>
        <h2 id="kpi-afternoon">-</h2>
        <small>${currentLang === 'th' ? 'รอบช่วงบ่าย' : 'Afternoon records'}</small>
      </div>
    </div>

    <div class="content-card">
      <div class="section-heading" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h3>${currentLang === 'th' ? 'รายการตรวจสอบประจำวัน' : 'Daily Inspection Records'}</h3>
          <p>${currentLang === 'th' ? 'รายการผลการตรวจสอบผู้รับเหมาตามวันที่เลือก' : 'Inspections on the selected date'}</p>
        </div>
        <button class="primary-button" style="padding:8px 16px; font-size:12px;" onclick="showPage('inspection')">
          + ${currentLang === 'th' ? 'ตรวจความปลอดภัยใหม่' : 'New Inspection'}
        </button>
      </div>

      <div id="dashboard-table-wrap" class="vendor-table-wrap">
        <p class="loading-text">${t("loading")}</p>
      </div>
    </div>
  `;

  document.getElementById("dashboard-date").addEventListener("change", e => {
    loadDashboardData(e.target.value);
  });

  loadDashboardData(todayStr);
}

function loadDashboardData(dateStr) {
  google.script.run
    .withSuccessHandler(data => {
      document.getElementById("kpi-companies").textContent = data.companiesInspected;
      document.getElementById("kpi-total").textContent = data.totalInspections;
      document.getElementById("kpi-morning").textContent = data.morningCount;
      document.getElementById("kpi-afternoon").textContent = data.afternoonCount;

      const wrap = document.getElementById("dashboard-table-wrap");
      if (!data.records || data.records.length === 0) {
        wrap.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">▤</div>
            <h3>${t("no_data")}</h3>
            <p>${currentLang === 'th' ? 'ยังไม่มีรายการตรวจในวันที่เลือก' : 'No records for this date.'}</p>
          </div>
        `;
        return;
      }

      wrap.innerHTML = `
        <table class="vendor-table">
          <thead>
            <tr>
              <th>${currentLang === 'th' ? 'ชื่อบริษัท' : 'Company'}</th>
              <th>${currentLang === 'th' ? 'ช่วงเวลา' : 'Period'}</th>
              <th>${currentLang === 'th' ? 'เวลาเข้า-ออก' : 'Check-in / Out'}</th>
              <th>${currentLang === 'th' ? 'ผลการตรวจ' : 'Result'}</th>
              <th>${currentLang === 'th' ? 'หมายเหตุ' : 'Remarks'}</th>
            </tr>
          </thead>
          <tbody>
            ${data.records.map(r => `
              <tr>
                <td><strong>${escapeHtml(r.companyName)}</strong></td>
                <td><span class="type-tag">${escapeHtml(r.period)}</span></td>
                <td>${escapeHtml(r.checkIn)} - ${escapeHtml(r.checkOut)}</td>
                <td>${renderResultBadge(r.result)}</td>
                <td>${escapeHtml(r.remarks || "-")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    })
    .withFailureHandler(err => {
      const wrap = document.getElementById("dashboard-table-wrap");
      if (wrap) wrap.innerHTML = `<p class="form-message error">⚠ ${escapeHtml(err.message)}</p>`;
    })
    .getDashboardData(dateStr);
}

// ========================================================
// 4. Module: Vendor Registration
// ========================================================
function renderVendorPage() {
  const content = document.getElementById("page-content");
  content.innerHTML = `
    <div class="welcome">
      <div>
        <h1>${t("menu_vendors")}</h1>
        <p>${currentLang === 'th' ? 'ลงทะเบียน จัดการ และค้นหาผู้รับเหมา' : 'Register, manage and search contractor companies'}</p>
      </div>
      <div class="vendor-count" id="vendor-count">${t("loading")}</div>
    </div>

    <div class="vendor-layout">
      <!-- Registration Form -->
      <div class="content-card">
        <div class="section-heading">
          <h3>${currentLang === 'th' ? 'ลงทะเบียนบริษัทใหม่' : 'Register New Vendor'}</h3>
          <p>${currentLang === 'th' ? 'กรอกข้อมูลและเลือกประเภทงานเสี่ยงสูง' : 'Enter company details and high-risk work types'}</p>
        </div>

        <form id="vendor-form" class="vendor-form">
          <div class="form-group">
            <label>${currentLang === 'th' ? 'ชื่อบริษัท' : 'Company Name'} <span>*</span></label>
            <input type="text" id="company-name" placeholder="Enter company name" required>
          </div>

          <div class="form-group">
            <label>${currentLang === 'th' ? 'พื้นที่ปฏิบัติงาน' : 'Work Location'} <span>*</span></label>
            <input type="text" id="work-location" placeholder="e.g. Building A Fl. 4" required>
          </div>

          <div class="form-group">
            <label>${currentLang === 'th' ? 'ประเภทงานความเสี่ยงสูง' : 'High-Risk Work Types'} <span>*</span></label>
            <div id="work-type-list" class="work-type-list">
              <p class="loading-text">${t("loading")}</p>
            </div>
          </div>

          <div id="vendor-message" class="form-message"></div>

          <button type="submit" class="primary-button" id="save-vendor-button">
            ${currentLang === 'th' ? 'บันทึกข้อมูลบริษัท' : 'Save Vendor'}
          </button>
        </form>
      </div>

      <!-- Vendors List Table -->
      <div class="content-card">
        <div class="section-heading">
          <h3>${currentLang === 'th' ? 'รายชื่อบริษัทผู้รับเหมา' : 'Registered Vendors'}</h3>
          <p>${currentLang === 'th' ? 'ค้นหา แก้ไข หรือเปิด/ปิดการใช้งาน' : 'Search, edit, or toggle status'}</p>
        </div>

        <div class="filter-toolbar">
          <input type="text" id="vendor-search" class="search-input" placeholder="${t('search_placeholder')}">
          <select id="vendor-status-filter" class="filter-select">
            <option value="ALL">${t("filter_all")}</option>
            <option value="ACTIVE">${t("status_active")}</option>
            <option value="INACTIVE">${t("status_inactive")}</option>
          </select>
        </div>

        <div class="vendor-table-wrap">
          <table class="vendor-table">
            <thead>
              <tr>
                <th>${currentLang === 'th' ? 'บริษัท' : 'Company'}</th>
                <th>${currentLang === 'th' ? 'พื้นที่' : 'Location'}</th>
                <th>${currentLang === 'th' ? 'ประเภทงาน' : 'Work Types'}</th>
                <th>${currentLang === 'th' ? 'สถานะ' : 'Status'}</th>
                <th>${currentLang === 'th' ? 'การจัดการ' : 'Action'}</th>
              </tr>
            </thead>
            <tbody id="vendor-table-body">
              <tr><td colspan="5">${t("loading")}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById("vendor-form").addEventListener("submit", submitVendorForm);
  document.getElementById("vendor-search").addEventListener("input", filterVendorsDisplay);
  document.getElementById("vendor-status-filter").addEventListener("change", filterVendorsDisplay);

  loadVendorPageData();
}

function loadVendorPageData() {
  google.script.run
    .withSuccessHandler(data => {
      window.cachedWorkTypes = data.workTypes;
      window.cachedVendors = data.vendors;

      renderWorkTypesOptions(data.workTypes);
      filterVendorsDisplay();
    })
    .withFailureHandler(err => {
      showVendorMessage(err.message, "error");
    })
    .getVendorPageData();
}

function renderWorkTypesOptions(types) {
  const container = document.getElementById("work-type-list");
  if (!container) return;

  if (!types || types.length === 0) {
    container.innerHTML = "<p>No work types available.</p>";
    return;
  }

  container.innerHTML = types.map(type => `
    <label class="work-type-option">
      <input type="checkbox" name="work-type" value="${escapeHtml(type)}">
      <span>${escapeHtml(type)}</span>
    </label>
  `).join("");
}

function filterVendorsDisplay() {
  const searchInput = document.getElementById("vendor-search");
  const statusFilter = document.getElementById("vendor-status-filter");
  if (!searchInput || !window.cachedVendors) return;

  const query = searchInput.value.toLowerCase().trim();
  const status = statusFilter.value;

  const filtered = window.cachedVendors.filter(v => {
    const matchQuery = v.companyName.toLowerCase().includes(query) || v.workLocation.toLowerCase().includes(query);
    const matchStatus = status === "ALL" || (status === "ACTIVE" && v.isActive) || (status === "INACTIVE" && !v.isActive);
    return matchQuery && matchStatus;
  });

  const tbody = document.getElementById("vendor-table-body");
  const count = document.getElementById("vendor-count");
  if (count) count.textContent = `${filtered.length} ${currentLang === 'th' ? 'บริษัท' : 'Companies'}`;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">${t("no_data")}</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(v => `
    <tr>
      <td><strong>${escapeHtml(v.companyName)}</strong></td>
      <td>${escapeHtml(v.workLocation)}</td>
      <td>
        ${(v.workTypes || []).map(t => `<span class="type-tag">${escapeHtml(t)}</span>`).join(" ")}
      </td>
      <td>
        <span class="badge ${v.isActive ? 'badge-active' : 'badge-inactive'}">
          ${v.isActive ? t("status_active") : t("status_inactive")}
        </span>
      </td>
      <td>
        <button class="btn-sm btn-outline" onclick="openEditVendorModal('${escapeHtml(v.companyName)}')">
          ${currentLang === 'th' ? 'แก้ไข' : 'Edit'}
        </button>
        <button class="btn-sm ${v.isActive ? 'btn-danger-outline' : 'btn-success-outline'}"
          onclick="toggleVendorStatusAction('${escapeHtml(v.companyName)}')">
          ${v.isActive ? (currentLang === 'th' ? 'ระงับ' : 'Deactivate') : (currentLang === 'th' ? 'เปิดใช้' : 'Activate')}
        </button>
      </td>
    </tr>
  `).join("");
}

function submitVendorForm(event) {
  event.preventDefault();
  const button = document.getElementById("save-vendor-button");
  const selectedTypes = Array.from(document.querySelectorAll('input[name="work-type"]:checked')).map(i => i.value);

  if (selectedTypes.length === 0) {
    showVendorMessage(currentLang === 'th' ? "กรุณาเลือกประเภทงานอย่างน้อย 1 ประเภท" : "Please select at least 1 work type", "error");
    return;
  }

  const formData = {
    companyName: document.getElementById("company-name").value,
    workLocation: document.getElementById("work-location").value,
    workTypes: selectedTypes
  };

  button.disabled = true;
  button.textContent = t("saving");

  google.script.run
    .withSuccessHandler(res => {
      showVendorMessage("✔ " + res.message, "success");
      document.getElementById("vendor-form").reset();
      button.disabled = false;
      button.textContent = currentLang === 'th' ? 'บันทึกข้อมูลบริษัท' : 'Save Vendor';
      loadVendorPageData();
    })
    .withFailureHandler(err => {
      showVendorMessage("⚠ " + err.message, "error");
      button.disabled = false;
      button.textContent = currentLang === 'th' ? 'บันทึกข้อมูลบริษัท' : 'Save Vendor';
    })
    .saveVendor(formData);
}

function toggleVendorStatusAction(companyName) {
  if (!confirm(currentLang === 'th' ? `คุณต้องการเปลี่ยนสถานะของ ${companyName} หรือไม่?` : `Change status for ${companyName}?`)) return;

  google.script.run
    .withSuccessHandler(res => {
      alert("✔ " + res.message);
      loadVendorPageData();
    })
    .withFailureHandler(err => {
      alert("⚠ " + err.message);
    })
    .toggleVendorStatus(companyName);
}

function openEditVendorModal(companyName) {
  const vendor = (window.cachedVendors || []).find(v => v.companyName === companyName);
  if (!vendor) return;

  const allTypes = window.cachedWorkTypes || [];

  const modalHtml = `
    <div class="modal-box">
      <div class="modal-header">
        <h3>${currentLang === 'th' ? 'แก้ไขข้อมูลผู้รับเหมา' : 'Edit Vendor Details'}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="edit-vendor-form">
          <div class="form-group">
            <label>${currentLang === 'th' ? 'ชื่อบริษัท' : 'Company Name'}</label>
            <input type="text" id="edit-vendor-name" value="${escapeHtml(vendor.companyName)}" disabled style="opacity:0.7;">
          </div>
          <div class="form-group">
            <label>${currentLang === 'th' ? 'พื้นที่ปฏิบัติงาน' : 'Work Location'}</label>
            <input type="text" id="edit-vendor-location" value="${escapeHtml(vendor.workLocation)}" required>
          </div>
          <div class="form-group">
            <label>${currentLang === 'th' ? 'ประเภทงานความเสี่ยงสูง' : 'Work Types'}</label>
            <div class="work-type-list" style="max-height:180px; overflow-y:auto;">
              ${allTypes.map(t => {
                const checked = (vendor.workTypes || []).includes(t) ? 'checked' : '';
                return `
                  <label class="work-type-option">
                    <input type="checkbox" name="edit-work-type" value="${escapeHtml(t)}" ${checked}>
                    <span>${escapeHtml(t)}</span>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
          <div id="edit-vendor-msg" class="form-message"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-sm btn-outline" onclick="closeModal()">${t("cancel")}</button>
        <button class="btn-sm primary-button" id="save-edit-vendor-btn" onclick="saveEditedVendor()">${t("save")}</button>
      </div>
    </div>
  `;

  openModal(modalHtml);
}

function saveEditedVendor() {
  const companyName = document.getElementById("edit-vendor-name").value;
  const workLocation = document.getElementById("edit-vendor-location").value;
  const selectedTypes = Array.from(document.querySelectorAll('input[name="edit-work-type"]:checked')).map(i => i.value);
  const btn = document.getElementById("save-edit-vendor-btn");
  const msg = document.getElementById("edit-vendor-msg");

  if (!workLocation) {
    msg.textContent = "กรุณาระบุพื้นที่ปฏิบัติงาน";
    msg.className = "form-message error";
    return;
  }
  if (selectedTypes.length === 0) {
    msg.textContent = "กรุณาเลือกประเภทงานอย่างน้อย 1 ประเภท";
    msg.className = "form-message error";
    return;
  }

  btn.disabled = true;
  btn.textContent = t("saving");

  google.script.run
    .withSuccessHandler(res => {
      closeModal();
      alert("✔ " + res.message);
      loadVendorPageData();
    })
    .withFailureHandler(err => {
      msg.textContent = "⚠ " + err.message;
      msg.className = "form-message error";
      btn.disabled = false;
      btn.textContent = t("save");
    })
    .updateVendor({
      companyName: companyName,
      workLocation: workLocation,
      workTypes: selectedTypes
    });
}

function showVendorMessage(msg, type) {
  const box = document.getElementById("vendor-message");
  if (!box) return;
  box.textContent = msg;
  box.className = "form-message " + type;
}

function setupFileInputHandler(inputId, fileType, previewId) {
  const input = document.getElementById(inputId);
  if (!input) return;

  input.addEventListener("change", event => {
    const files = Array.from(event.target.files);
    for (const file of files) {
      if (file.size > 5 * 1024 * 1024) {
        showInspectionMessage(`ไฟล์ ${file.name} มีขนาดเกิน 5 MB`, "error");
        continue;
      }
      window.inspectionFileState[fileType].push(file);
    }
    input.value = "";
    renderFilePreview(fileType, previewId);
  });
}

function renderFilePreview(fileType, previewId) {
  const container = document.getElementById(previewId);
  if (!container) return;
  const files = window.inspectionFileState[fileType] || [];

  if (files.length === 0) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = files.map((file, idx) => `
    <div class="file-preview-item">
      <div class="file-name" title="${escapeHtml(file.name)}">📄 ${escapeHtml(file.name)}</div>
      <div class="file-meta">
        <span class="file-size">${formatFileSize(file.size)}</span>
        <button type="button" class="file-remove-btn" onclick="removeInspectionFile('${fileType}', ${idx}, '${previewId}')">✕</button>
      </div>
    </div>
  `).join("");
}

function removeInspectionFile(fileType, index, previewId) {
  if (window.inspectionFileState[fileType]) {
    window.inspectionFileState[fileType].splice(index, 1);
    renderFilePreview(fileType, previewId);
  }
}

function setTodayForInspection() {
  const now = new Date();
  const localDate = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
  const el = document.getElementById("inspection-date");
  if (el) el.value = localDate;
}

    </div>
  `;

function readInspectionFile(file, fileType) {
  return new Promise((resolve, reject) => {
    if (file.size > 5 * 1024 * 1024) return reject(new Error(file.name + " มีขนาดเกิน 5 MB"));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, mimeType: file.type || "application/octet-stream", fileType: fileType, data: reader.result });
    reader.onerror = () => reject(new Error("ไม่สามารถอ่านไฟล์ " + file.name));
    reader.readAsDataURL(file);
  });
}

async function submitInspectionForm(event) {
  event.preventDefault();
  const button = document.getElementById("save-inspection-button");
  const checkIn = document.getElementById("check-in").value;
  const checkOut = document.getElementById("check-out").value;

  if (checkIn && checkOut && checkOut < checkIn) {
    showInspectionMessage("เวลาตรวจออก (Check-out) ต้องไม่เกิดขึ้นก่อนเวลาเข้าตรวจ (Check-in)", "error");
    return;
  }

  button.disabled = true;
  button.textContent = currentLang === 'th' ? "กำลังประมวลผลไฟล์..." : "Processing files...";

  try {
    const files = [];
    const types = ["Before", "After", "Work Permit"];
    for (const t of types) {
      for (const f of (window.inspectionFileState[t] || [])) {
        files.push(await readInspectionFile(f, t));
      }
    }

    button.textContent = t("saving");

    const formData = {
      companyName: document.getElementById("inspection-company").value,
      inspectionDate: document.getElementById("inspection-date").value,
      period: document.getElementById("inspection-period").value,
      checkIn: checkIn,
      checkOut: checkOut,
      result: document.getElementById("inspection-result").value,
      remarks: document.getElementById("inspection-remarks").value,
      files: files
    };

    google.script.run
      .withSuccessHandler(res => {
        const fileInfo = res.fileCount > 0 ? ` (${res.fileCount} files)` : "";
        showInspectionMessage(`✔ ${res.message}${fileInfo}`, "success");
        document.getElementById("inspection-form").reset();
        window.inspectionFileState = { Before: [], After: [], "Work Permit": [] };
        renderFilePreview("Before", "before-preview");
        renderFilePreview("After", "after-preview");
        renderFilePreview("Work Permit", "permit-preview");
        setTodayForInspection();
        document.getElementById("vendor-info").innerHTML = currentLang === 'th' ? "กรุณาเลือกบริษัท" : "Please select a company";
        button.disabled = false;
        button.textContent = currentLang === 'th' ? 'บันทึกการตรวจสอบ' : 'Save Inspection';
      })
      .withFailureHandler(err => {
        showInspectionMessage(`⚠ ${err.message}`, "error");
        button.disabled = false;
        button.textContent = currentLang === 'th' ? 'บันทึกการตรวจสอบ' : 'Save Inspection';
      })
      .saveInspection(formData);

  } catch (err) {
    showInspectionMessage(`⚠ ${err.message}`, "error");
    button.disabled = false;
    button.textContent = currentLang === 'th' ? 'บันทึกการตรวจสอบ' : 'Save Inspection';
  }
}

function showInspectionMessage(msg, type) {
  const box = document.getElementById("inspection-message");
  if (!box) return;
  box.textContent = msg;
  box.className = "form-message " + type;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function filterHistoryDisplay() {
  if (!window.cachedHistory) return;
  const q = (document.getElementById("history-search")?.value || "").toLowerCase().trim();
  const dateVal = document.getElementById("history-date-filter")?.value || "";
  const resVal = document.getElementById("history-result-filter")?.value || "";

  const filtered = window.cachedHistory.filter(item => {
    const matchQ = item.companyName.toLowerCase().includes(q) || (item.remarks || "").toLowerCase().includes(q);
    const matchDate = !dateVal || item.inspectionDate === dateVal;
    const matchRes = !resVal || item.result === resVal;
    return matchQ && matchDate && matchRes;
  });

  const countEl = document.getElementById("history-total-count");
  if (countEl) countEl.textContent = `${filtered.length} ${currentLang === 'th' ? 'รายการ' : 'Records'}`;

  const tbody = document.getElementById("history-table-body");
  if (!tbody) return;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:24px; color:var(--muted);">${t("no_data")}</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map((r, idx) => `
    <tr>
      <td>${escapeHtml(r.inspectionDate)}</td>
      <td><strong>${escapeHtml(r.companyName)}</strong></td>
      <td><span class="type-tag">${escapeHtml(r.period)}</span></td>
      <td>${escapeHtml(r.checkIn)} - ${escapeHtml(r.checkOut)}</td>
      <td>${renderResultBadge(r.result)}</td>

          ${currentLang === 'th' ? 'ดูรายละเอียด' : 'View'}
        </button>
      </td>
    </tr>
  `).join("");
}

  const status = document.getElementById("permit-status-filter")?.value || "";

  const permits = window.cachedPermitsData.permits || [];
  const filtered = permits.filter(p => {
    const matchQ = p.permitNo.toLowerCase().includes(q) || p.companyName.toLowerCase().includes(q) || p.workType.toLowerCase().includes(q);
    const matchStatus = !status || p.status === status;
    return matchQ && matchStatus;
  });

  const tbody = document.getElementById("permit-table-body");
  if (!tbody) return;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:24px; color:var(--muted);">${t("no_data")}</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(p => `
    <tr>
      <td><strong>${escapeHtml(p.permitNo)}</strong></td>
      <td>${escapeHtml(p.companyName)}</td>
      <td><span class="type-tag">${escapeHtml(p.workType)}</span></td>
      <td>${escapeHtml(p.startDate)} - ${escapeHtml(p.endDate)}</td>
      <td>${escapeHtml(p.supervisorName)}</td>
      <td>
        <span class="badge ${p.status === 'Active' ? 'badge-active' : (p.status === 'Completed' ? 'badge-pass' : 'badge-fail')}">
          ${escapeHtml(p.status)}
        </span>
      </td>
      <td>
        ${p.status === 'Active' ? `
          <button class="btn-sm btn-outline" onclick="changePermitStatusAction('${p.permitNo}', 'Completed')">
            ${currentLang === 'th' ? 'ปิดงาน' : 'Close'}
          </button>
        ` : '-'}
      </td>
    </tr>
  `).join("");
}

function submitCreatePermit() {
  const form = {
    companyName: document.getElementById("wp-company")?.value,
    workLocation: document.getElementById("wp-location")?.value,
    workType: document.getElementById("wp-type")?.value,
    startDate: document.getElementById("wp-start")?.value,
    endDate: document.getElementById("wp-end")?.value,
    supervisorName: document.getElementById("wp-supervisor")?.value,
    safetyOfficer: document.getElementById("wp-safety-officer")?.value,
    safetyNotes: document.getElementById("wp-notes")?.value
  };

  const msg = document.getElementById("create-permit-msg");
  const btn = document.getElementById("submit-wp-btn");

  if (!form.companyName || !form.workLocation || !form.workType || !form.startDate || !form.endDate) {
    msg.textContent = currentLang === 'th' ? "กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบถ้วน" : "Please fill in all required fields (*)";
    msg.className = "form-message error";
    return;
  }

  btn.disabled = true;
  btn.textContent = t("saving");

  google.script.run
    .withSuccessHandler(res => {
      closeModal();
      alert("✔ " + res.message);
      loadWorkPermitData();
    })
    .withFailureHandler(err => {
      msg.textContent = "⚠ " + err.message;
      msg.className = "form-message error";
      btn.disabled = false;
      btn.textContent = t("save");
    })
    .saveWorkPermit(form);
}

function changePermitStatusAction(permitNo, status) {
  if (!confirm(currentLang === 'th' ? `ต้องการปิดงานใบอนุญาต ${permitNo} หรือไม่?` : `Close permit ${permitNo}?`)) return;

  google.script.run
    .withSuccessHandler(res => {
      alert("✔ " + res.message);
      loadWorkPermitData();
    })
    .withFailureHandler(err => {
      alert("⚠ " + err.message);
    })
    .updatePermitStatus(permitNo, status);
}

function filterDocumentsDisplay() {
  if (!window.cachedDocuments) return;
  const q = (document.getElementById("doc-search")?.value || "").toLowerCase().trim();
  const type = document.getElementById("doc-type-filter")?.value || "";

  const filtered = window.cachedDocuments.filter(f => {
    const matchQ = f.fileName.toLowerCase().includes(q) || f.companyName.toLowerCase().includes(q);
    const matchType = !type || f.fileType === type;
    return matchQ && matchType;
  });

  const countEl = document.getElementById("docs-total-count");
  if (countEl) countEl.textContent = `${filtered.length} ${currentLang === 'th' ? 'ไฟล์' : 'Files'}`;

  const tbody = document.getElementById("docs-table-body");
  if (!tbody) return;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">${t("no_data")}</td></tr>`;
    return;

  tbody.innerHTML = filtered.map(f => `

      <td><span class="type-tag">${escapeHtml(f.fileType)}</span></td>

          ↗ ${currentLang === 'th' ? 'เปิดใน Drive' : 'Open in Drive'}

      </td>
    </tr>
  `).join("");
}

// ========================================================
// 10. Modal Utilities & Helpers
// ========================================================
function openModal(html) {
  const container = document.getElementById("modal-container");
  if (!container) return;
  container.innerHTML = `<div class="modal-backdrop" onclick="handleBackdropClick(event)">${html}</div>`;
}

function closeModal() {
  const container = document.getElementById("modal-container");
  if (container) container.innerHTML = "";
}

function handleBackdropClick(event) {
  if (event.target.classList.contains("modal-backdrop")) {
    closeModal();
  }
}

function renderResultBadge(result) {
  if (result === "ผ่าน") return `<span class="badge badge-pass">${t("status_pass")}</span>`;
  if (result === "ต้องปรับปรุง") return `<span class="badge badge-improve">${t("status_improve")}</span>`;
  return `<span class="badge badge-fail">${t("status_fail")}</span>`;
}

function formatFileSize(bytes) {
  if (!bytes || bytes === 0) return "0 B";
  const k = 1024;
  const sizes = ["B", "KB", "MB"];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1) + " " + sizes[i];
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}
